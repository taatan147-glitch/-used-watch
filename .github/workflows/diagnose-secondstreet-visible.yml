# 画面あり比較版。手動実行のみ、RRLを1回検索して終了します。
# GitHub内の仮想画面で実行します。User-Agentの手動変更は行いません。
name: セカスト単体診断（画面あり）
'on':
  workflow_dispatch: {}
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
    - name: Node.js セットアップ
      uses: actions/setup-node@v6
      with:
        node-version: 22.22.0
    - name: 診断用フォルダを準備
      run: mkdir -p "$RUNNER_TEMP/secondstreet-diagnostic"
    - name: 仮想画面を準備
      run: |
        if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
        fi
    - name: PuppeteerとChromeを準備
      working-directory: ${{ runner.temp }}/secondstreet-diagnostic
      run: |
        npm init --yes > /dev/null
        npm install --ignore-scripts --no-audit --no-fund puppeteer@25.18.1
        npx --no-install puppeteer browsers install chrome
    - name: 診断結果
      working-directory: ${{ runner.temp }}/secondstreet-diagnostic
      run: |
        xvfb-run -a node --input-type=module <<'SECONDSTREET_DIAGNOSTIC_JS'
        import puppeteer from 'puppeteer';
        import { writeFile, appendFile } from 'node:fs/promises';
        import { setTimeout as delay } from 'node:timers/promises';

        const RESULT_MESSAGES = {
          products_detected: '商品データを取得できました。GitHub Actionsの結果との比較に進めます。',
          missing_fields: '商品カードはありますが、必要な項目が不足しています。取得処理を確認します。',
          access_denied: 'アクセス拒否を確認しました。この診断では再試行しません。',
          verification_required: '確認画面が表示されています。この診断では操作せず終了します。',
          http_error: 'HTTPエラーです。ステータスだけでは原因を断定できません。',
          empty_results: '画面に検索結果0件の表示がありました。',
          selector_mismatch: '商品詳細リンクはありますが、現在の監視コードの取得条件に一致しません。',
          navigation_error: 'ページを正常に開けませんでした。通信や読み込みのエラーを確認します。',
          unexpected_page: '商品一覧・0件・拒否のいずれとも判別できませんでした。',
        };

        function classifyResult(snapshot) {
          if (snapshot.denialDetected) return 'access_denied';
          if (snapshot.verificationDetected) return 'verification_required';
          if (snapshot.httpStatus >= 400) return 'http_error';
          if (snapshot.usableItemCount > 0) return 'products_detected';
          if (snapshot.cardCount > 0) return 'missing_fields';
          if (snapshot.navigationError) return 'navigation_error';
          if (snapshot.emptyResultsDetected) return 'empty_results';
          if (snapshot.productLinkCount > 0) return 'selector_mismatch';
          return 'unexpected_page';
        }

        // Only preserve public search parameters; omit any session/redirect parameters.
        function publicUrl(raw) {
          try {
            const url = new URL(raw);
            const safe = new URL(url.origin + url.pathname);
            for (const name of ['keyword', 'sortBy']) {
              if (url.searchParams.has(name)) safe.searchParams.set(name, url.searchParams.get(name));
            }
            return safe.href;
          } catch { return ''; }
        }

        async function collectSnapshot(page) {
          return page.evaluate(() => {
            const title = document.title || '';
            const bodyText = document.body?.innerText || '';
            const start = bodyText.slice(0, 2000);
            const heading = document.querySelector('h1')?.textContent?.trim() || '';
            const denialDetected = /^access denied\b/i.test(title.trim()) ||
              /^access denied\b/i.test(heading) ||
              /^\s*access denied\b/i.test(start) ||
              /you don't have permission to access/i.test(start);
            const verificationDetected = !denialDetected && (
              /verify (?:that )?you are human|checking your browser|human verification|just a moment|captcha/i.test(title + ' ' + start) ||
              /ロボットではない|人間であることを確認|アクセスの確認が必要/.test(start)
            );
            const emptyResultsDetected = /検索結果\s*[：:]?\s*0\s*(?:点|件)/.test(bodyText) ||
              /(?:検索条件に一致する|お探しの|該当する)商品(?:は|が)(?:見つかりません|ありません)/.test(bodyText);
            const cards = [...document.querySelectorAll('li.itemCard[goodsid], li[goodsid]')];
            const productLinks = [...document.querySelectorAll('a[href]')].filter((a) =>
              /\/goods\/detail\/|[?&/]goodsId[=/]/i.test(a.getAttribute('href') || '')
            );
            const ids = new Set();
            const items = [];
            for (const card of cards) {
              const id = (card.getAttribute('goodsid') || '').trim();
              if (!id || ids.has(id)) continue;
              ids.add(id);
              const link = card.querySelector("a.itemCard_inner, a[href*='goodsId']");
              const image = card.querySelector('.itemCard_img img, img');
              const body = card.querySelector('.itemCard_body');
              const title = image?.alt?.trim() ||
                (body?.textContent || '').trim().replace(/\s+/g, ' ').split(/サイズ|商品の状態|¥|￥/)[0].trim();
              const priceContent = card.querySelector("[itemprop='price'][content]")?.getAttribute('content');
              const priceText = card.querySelector('[class*=priceNum], [class*=price-num]')?.textContent || '';
              const priceMatch = priceText.match(/^[\s¥￥]*([\d,]+)/);
              const price = priceContent != null
                ? Number(priceContent.replace(/,/g, '')) || 0
                : (priceMatch ? Number(priceMatch[1].replace(/,/g, '')) : 0);
              const url = link?.href || '';
              if (title && url && /^https?:/.test(url)) items.push({ id, title, price, url });
            }
            return {
              title,
              heading,
              denialDetected,
              verificationDetected,
              emptyResultsDetected,
              cardCount: cards.length,
              productLinkCount: productLinks.length,
              usableItemCount: items.length,
              itemsWithPrice: items.filter((i) => i.price > 0).length,
              samples: items.slice(0, 3),
            };
          });
        }

        async function diagnosePage(page, { searchUrl, settleMs = 4000, readyTimeoutMs = 12000 }) {
          let httpStatus = null;
          let navigationError = null;
          try {
            const response = await page.goto(searchUrl, { waitUntil: 'domcontentloaded', timeout: 45000 });
            httpStatus = response?.status() ?? null;
          } catch (error) {
            navigationError = { name: error.name, message: String(error.message).slice(0, 300) };
          }

          // Inspect denials before waiting for products. Do not refresh or navigate again.
          let snapshot = await collectSnapshot(page);
          if (!snapshot.denialDetected && !snapshot.verificationDetected && !navigationError && !(httpStatus >= 400)) {
            if (settleMs > 0) await delay(settleMs);
            if (readyTimeoutMs > 0) {
              await page.waitForFunction(() => {
                const text = document.body?.innerText || '';
                return document.querySelector('li.itemCard[goodsid], li[goodsid]') ||
                  /^access denied\b/i.test(document.title.trim()) ||
                  /you don't have permission to access|verify (?:that )?you are human|ロボットではない/i.test(text.slice(0, 2000)) ||
                  /検索結果\s*[：:]?\s*0\s*(?:点|件)/.test(text);
              }, { timeout: readyTimeoutMs }).catch((error) => {
                if (error.name !== 'TimeoutError') throw error;
              });
            }
            snapshot = await collectSnapshot(page);
          }

          const data = { httpStatus, finalUrl: publicUrl(page.url()), navigationError, ...snapshot };
          const classification = classifyResult(data);
          return { classification, message: RESULT_MESSAGES[classification], ...data };
        }


        const keyword = 'RRL';
        const searchUrl = 'https://www.2ndstreet.jp/search?' + new URLSearchParams({ keyword, sortBy: 'arrival' });
        const report = {
          schemaVersion: 1,
          startedAt: new Date().toISOString(),
          nodeVersion: process.version,
          puppeteerVersion: '25.18.1',
          platform: process.platform,
          keyword,
          searchUrl,
          mode: 'github-actions-visible-temporary-profile',
          testVersion: 'visible-v2',
        };
        let browser;
        try {
          browser = await puppeteer.launch({
            headless: false,
            timeout: 30000,
            protocolTimeout: 60000,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          report.browserVersion = await browser.version();
          report.userAgent = await browser.userAgent();
          const page = await browser.newPage();
          Object.assign(report, await diagnosePage(page, { searchUrl }));
        } catch (error) {
          report.classification = 'setup_or_runtime_error';
          report.message = String(error.message).slice(0, 1000);
        } finally {
          if (browser) await browser.close().catch(() => {});
          report.finishedAt = new Date().toISOString();
          const json = JSON.stringify(report, null, 2);
          console.log('diagnostic-result.json');
          console.log(json);
          await writeFile('diagnostic-result.json', json, 'utf8');
          if (process.env.GITHUB_STEP_SUMMARY) {
            const safeJson = json.replace(/`/g, '\\u0060');
            await appendFile(process.env.GITHUB_STEP_SUMMARY,
              '# セカスト単体診断\n\n' +
              '- 判定: ' + report.classification + '\n' +
              '- HTTP: ' + (report.httpStatus ?? '未取得') + '\n' +
              '- 商品カード: ' + (report.cardCount ?? '未取得') + '\n' +
              '- データ取得: ' + (report.usableItemCount ?? '未取得') + '\n\n' +
              '```json\n' + safeJson + '\n```\n', 'utf8');
          }
        }
        if (report.classification !== 'products_detected') process.exitCode = 1;
        SECONDSTREET_DIAGNOSTIC_JS
