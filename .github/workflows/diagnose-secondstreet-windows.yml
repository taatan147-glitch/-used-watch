# 公開リポジトリ向け、標準Windows環境での単体診断。手動実行専用です。
# PCで成功した診断と同じ取得処理で、RRLを1回だけ検索します。
# インストール済みChrome/Edgeを通常モードで起動します。識別情報は手動変更しません。
# この結果だけで継続監視の安定性や拒否原因を確定しません。
name: セカスト単体診断（Windows）
'on':
  workflow_dispatch: {}
permissions: {}
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Node.js セットアップ
      uses: actions/setup-node@v6
      with:
        node-version: 22.22.0
    - name: 診断用フォルダを準備
      run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'secondstreet-diagnostic') -Force | Out-Null
    - name: Puppeteer Coreを準備
      working-directory: ${{ runner.temp }}/secondstreet-diagnostic
      run: |
        npm.cmd init --yes > $null
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npm.cmd install --ignore-scripts --no-audit --no-fund puppeteer-core@25.18.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: 診断結果
      working-directory: ${{ runner.temp }}/secondstreet-diagnostic
      run: |
        @'
        /**
         * CHASE: one Second Street search for diagnosis.
         * Uses a temporary browser profile. No login, Discord, Worker, or seen.json.
         * A denial or verification page is reported without retrying or interacting.
         */
        import { existsSync, writeFileSync } from 'node:fs';
        import { dirname, join, resolve } from 'node:path';
        import { fileURLToPath } from 'node:url';
        import { setTimeout as delay } from 'node:timers/promises';

        export const RESULT_MESSAGES = {
          products_detected: '商品データを取得できました。GitHub Actionsの結果との比較に進めます。',
          missing_fields: '商品カードはありますが、必要な項目が不足しています。取得処理を確認します。',
          access_denied: 'アクセス拒否を確認しました。この診断では再試行しません。',
          verification_required: '確認画面が表示されています。この診断では操作せず終了します。',
          http_error: 'HTTPエラーです。ステータスだけでは原因を断定できません。',
          empty_results: '画面に検索結果0件の表示がありました。',
          selector_mismatch: '商品詳細リンクはありますが、現在の監視コードの取得条件に一致しません。',
          navigation_error: 'ページを正常に開けませんでした。通信や読み込みのエラーを確認します。',
          unexpected_page: '商品一覧・0件・拒否のいずれとも判別できませんでした。',
        };

        export function classifyResult(snapshot) {
          if (snapshot.denialDetected) return 'access_denied';
          if (snapshot.verificationDetected) return 'verification_required';
          if (snapshot.httpStatus >= 400) return 'http_error';
          if (snapshot.usableItemCount > 0) return 'products_detected';
          if (snapshot.cardCount > 0) return 'missing_fields';
          if (snapshot.navigationError) return 'navigation_error';
          if (snapshot.emptyResultsDetected) return 'empty_results';
          if (snapshot.productLinkCount > 0) return 'selector_mismatch';
          return 'unexpected_page';
        }

        // Only preserve public search parameters; omit any session/redirect parameters.
        function publicUrl(raw) {
          try {
            const url = new URL(raw);
            const safe = new URL(url.origin + url.pathname);
            for (const name of ['keyword', 'sortBy']) {
              if (url.searchParams.has(name)) safe.searchParams.set(name, url.searchParams.get(name));
            }
            return safe.href;
          } catch { return ''; }
        }

        export async function collectSnapshot(page) {
          return page.evaluate(() => {
            const title = document.title || '';
            const bodyText = document.body?.innerText || '';
            const start = bodyText.slice(0, 2000);
            const heading = document.querySelector('h1')?.textContent?.trim() || '';
            const denialDetected = /^access denied\b/i.test(title.trim()) ||
              /^access denied\b/i.test(heading) ||
              /^\s*access denied\b/i.test(start) ||
              /you don't have permission to access/i.test(start);
            const verificationDetected = !denialDetected && (
              /verify (?:that )?you are human|checking your browser|human verification|just a moment|captcha/i.test(title + ' ' + start) ||
              /ロボットではない|人間であることを確認|アクセスの確認が必要/.test(start)
            );
            const emptyResultsDetected = /検索結果\s*[：:]?\s*0\s*(?:点|件)/.test(bodyText) ||
              /(?:検索条件に一致する|お探しの|該当する)商品(?:は|が)(?:見つかりません|ありません)/.test(bodyText);
            const cards = [...document.querySelectorAll('li.itemCard[goodsid], li[goodsid]')];
            const productLinks = [...document.querySelectorAll('a[href]')].filter((a) =>
              /\/goods\/detail\/|[?&/]goodsId[=/]/i.test(a.getAttribute('href') || '')
            );
            const ids = new Set();
            const items = [];
            for (const card of cards) {
              const id = (card.getAttribute('goodsid') || '').trim();
              if (!id || ids.has(id)) continue;
              ids.add(id);
              const link = card.querySelector("a.itemCard_inner, a[href*='goodsId']");
              const image = card.querySelector('.itemCard_img img, img');
              const body = card.querySelector('.itemCard_body');
              const title = image?.alt?.trim() ||
                (body?.textContent || '').trim().replace(/\s+/g, ' ').split(/サイズ|商品の状態|¥|￥/)[0].trim();
              const priceContent = card.querySelector("[itemprop='price'][content]")?.getAttribute('content');
              const priceText = card.querySelector('[class*=priceNum], [class*=price-num]')?.textContent || '';
              const priceMatch = priceText.match(/^[\s¥￥]*([\d,]+)/);
              const price = priceContent != null
                ? Number(priceContent.replace(/,/g, '')) || 0
                : (priceMatch ? Number(priceMatch[1].replace(/,/g, '')) : 0);
              const url = link?.href || '';
              if (title && url && /^https?:/.test(url)) items.push({ id, title, price, url });
            }
            return {
              title,
              heading,
              denialDetected,
              verificationDetected,
              emptyResultsDetected,
              cardCount: cards.length,
              productLinkCount: productLinks.length,
              usableItemCount: items.length,
              itemsWithPrice: items.filter((i) => i.price > 0).length,
              samples: items.slice(0, 3),
            };
          });
        }

        export async function diagnosePage(page, { searchUrl, settleMs = 4000, readyTimeoutMs = 12000 }) {
          let httpStatus = null;
          let navigationError = null;
          try {
            const response = await page.goto(searchUrl, { waitUntil: 'domcontentloaded', timeout: 45000 });
            httpStatus = response?.status() ?? null;
          } catch (error) {
            navigationError = { name: error.name, message: String(error.message).slice(0, 300) };
          }

          // Inspect denials before waiting for products. Do not refresh or navigate again.
          let snapshot = await collectSnapshot(page);
          if (!snapshot.denialDetected && !snapshot.verificationDetected && !navigationError && !(httpStatus >= 400)) {
            if (settleMs > 0) await delay(settleMs);
            if (readyTimeoutMs > 0) {
              await page.waitForFunction(() => {
                const text = document.body?.innerText || '';
                return document.querySelector('li.itemCard[goodsid], li[goodsid]') ||
                  /^access denied\b/i.test(document.title.trim()) ||
                  /you don't have permission to access|verify (?:that )?you are human|ロボットではない/i.test(text.slice(0, 2000)) ||
                  /検索結果\s*[：:]?\s*0\s*(?:点|件)/.test(text);
              }, { timeout: readyTimeoutMs }).catch((error) => {
                if (error.name !== 'TimeoutError') throw error;
              });
            }
            snapshot = await collectSnapshot(page);
          }

          const data = { httpStatus, finalUrl: publicUrl(page.url()), navigationError, ...snapshot };
          const classification = classifyResult(data);
          return { classification, message: RESULT_MESSAGES[classification], ...data };
        }

        function findBrowser() {
          const candidates = process.platform === 'win32'
            ? [
              process.env.PROGRAMFILES && join(process.env.PROGRAMFILES, 'Google', 'Chrome', 'Application', 'chrome.exe'),
              process.env.LOCALAPPDATA && join(process.env.LOCALAPPDATA, 'Google', 'Chrome', 'Application', 'chrome.exe'),
              process.env['ProgramFiles(x86)'] && join(process.env['ProgramFiles(x86)'], 'Google', 'Chrome', 'Application', 'chrome.exe'),
              process.env.PROGRAMFILES && join(process.env.PROGRAMFILES, 'Microsoft', 'Edge', 'Application', 'msedge.exe'),
              process.env['ProgramFiles(x86)'] && join(process.env['ProgramFiles(x86)'], 'Microsoft', 'Edge', 'Application', 'msedge.exe'),
              process.env.LOCALAPPDATA && join(process.env.LOCALAPPDATA, 'Microsoft', 'Edge', 'Application', 'msedge.exe'),
            ]
            : process.platform === 'darwin'
              ? ['/Applications/Google Chrome.app/Contents/MacOS/Google Chrome', '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge']
              : ['/usr/bin/chromium', '/usr/bin/chromium-browser', '/usr/bin/google-chrome'];
          return candidates.find((path) => path && existsSync(path));
        }

        async function main() {
          const args = process.argv.slice(2);
          if (args.includes('--help')) {
            console.log('実行: node diagnose.mjs [キーワード]');
            console.log('既定値: RRL。検索1回。診断結果だけを同じフォルダに保存します。');
            return;
          }
          const keyword = args.join(' ').trim() || 'RRL';
          if (keyword.length > 150) throw new Error('キーワードは150文字以内にしてください。');
          const searchUrl = 'https://www.2ndstreet.jp/search?' + new URLSearchParams({ keyword, sortBy: 'arrival' });
          const directory = dirname(fileURLToPath(import.meta.url));
          const outputPath = join(directory, 'diagnostic-result.json');
          const startedAt = new Date().toISOString();
          const report = {
            schemaVersion: 1,
            startedAt,
            nodeVersion: process.version,
            platform: process.platform,
            keyword,
            searchUrl,
            mode: 'github-actions-windows-visible-temporary-profile',
            testVersion: 'windows-v3',
            puppeteerVersion: '25.18.1',
            disclaimer: 'This is a standalone diagnostic, not an exact reproduction of the existing GitHub Actions configuration.',
          };
          let browser;
          try {
            const executablePath = findBrowser();
            if (!executablePath) throw new Error('ChromeまたはEdgeが見つかりません。標準の場所にインストールされたブラウザが必要です。');
            let puppeteer;
            try { ({ default: puppeteer } = await import('puppeteer-core')); }
            catch { throw new Error('Puppeteer Coreの読み込みに失敗しました。準備ステップを確認してください。'); }
            console.log('セカスト診断を開始します。検索は1回、キーワードは「' + keyword + '」です。');
            console.log('GitHub内のWindowsでブラウザを起動します。検索は1回だけです。');
            browser = await puppeteer.launch({ executablePath, headless: false, timeout: 30000, protocolTimeout: 60000 });
            report.browserVersion = await browser.version();
            report.userAgent = await browser.userAgent();
            const page = await browser.newPage();
            Object.assign(report, await diagnosePage(page, { searchUrl }));
          } catch (error) {
            report.classification = 'setup_or_runtime_error';
            report.message = String(error.message).slice(0, 500);
            process.exitCode = 1;
          } finally {
            if (browser) await browser.close().catch(() => {});
            report.finishedAt = new Date().toISOString();
            writeFileSync(outputPath, JSON.stringify(report, null, 2), 'utf8');
          }
          console.log('\n結果: ' + report.classification);
          console.log(report.message);
          if (report.httpStatus != null) console.log('HTTP: ' + report.httpStatus);
          if (report.cardCount != null) console.log('商品カード: ' + report.cardCount + ' / データ取得: ' + report.usableItemCount);
          console.log('\n診断結果をGitHubのログとSummaryに表示します。');
        }

        if (process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {
          main().catch((error) => { console.error('診断エラー: ' + error.message); process.exitCode = 1; });
        }

        '@ | Set-Content -Encoding utf8NoBOM diagnose.mjs
        node diagnose.mjs
        $diagnosisExitCode = $LASTEXITCODE
        if (Test-Path 'diagnostic-result.json') {
          $rawJson = Get-Content -Raw -Encoding utf8 'diagnostic-result.json'
          Write-Output $rawJson
          $result = $rawJson | ConvertFrom-Json
          if ($env:GITHUB_STEP_SUMMARY) {
            $safeJson = $rawJson.Replace('`', '\u0060')
            $summary = @(
              '# セカスト単体診断（Windows）',
              '',
              ('- 判定: ' + $result.classification),
              ('- HTTP: ' + $result.httpStatus),
              ('- 商品カード: ' + $result.cardCount),
              ('- データ取得: ' + $result.usableItemCount),
              '',
              '```json',
              $safeJson,
              '```'
            ) -join [Environment]::NewLine
            Add-Content -Encoding utf8 -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }
          if ($result.classification -ne 'products_detected') { exit 1 }
        } else {
          Write-Output 'diagnostic-result.json was not created. Check the error above.'
          if ($diagnosisExitCode -eq 0) { $diagnosisExitCode = 1 }
        }
        exit $diagnosisExitCode
